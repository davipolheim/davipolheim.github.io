<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 3</title>
    <style>
        @font-face {
            font-family: 'CourierPrime';
            src: url(CourierPrime-Regular.ttf);
        }
        @font-face {
            font-family: 'CascadiaMono';
            src: url(../assets/cascadia_mono.woff2);
        }
        * {
            margin: 0;
            padding: 0;
        }
        body {
            padding: 16px;
        }
        .centralizar {
            font-family: 'CascadiaMono', 'CourierPrime';
            font-size: 24px;
            width: fit-content;
            margin: auto;
            margin-bottom: 16px;
        }
        #div-mapa {
            border: 1px solid black;
            padding: 8px;
        }
        #exibicao-mapa {
            white-space-collapse: preserve;
        }
        #form, #painel-pontuacao {
            outline: 1px solid black;
            width: fit-content;
            padding: 16px;
        }
        #painel-pontuacao {
            white-space-collapse: preserve;
        }
        #form button, input {
            font-family: 'CascadiaMono', 'CourierPrime';
            padding: 4px;
            background-color: white;
            outline: none;
        }
        #form button {
            cursor: pointer;
        }
        #form input {
            width: 178px;
        }
    </style>
</head>
<body>
    <div id="div-mapa" class="centralizar">
        <p id="exibicao-mapa">ola</p>
    </div>
    <div id="interface" class="centralizar">
        <p id="exibicao-pontos">Pontos: 0</p>
    </div>
    <div id="form" class="centralizar" style="display: none;">
        <label>Nome: <input id="input-nome" type="text" maxlength="24"></label>
        <button id="registrar-pontuacao">Registrar pontuação</button>
    </div>
    <div id="painel-pontuacao" class="centralizar">Tabela de pontuação             <br></div>

    <script>
        let lerPontos, estaMorrido;
    </script>
    <script type="module">

        const aleatorio = (num) => Math.floor(Math.random() * num);

        const mapa = [];
        const tamanhoMapa = 8;
        const player = [Math.floor(tamanhoMapa/2), Math.floor(tamanhoMapa/2)];
        const ponto = [aleatorio(tamanhoMapa), aleatorio(tamanhoMapa)];
        const rastro = [[player[0], player[1]-1]];

        const colisao = (pos1, pos2) => pos1[0] === pos2[0] && pos1[1] === pos2[1];

        let pontos = 0;
        lerPontos = () => pontos;
        let morreu = false;
        estaMorrido = () => morreu;

        function fimDeJogo() {
            exibicaoPontos.innerHTML += "<br>Fim de jogo"
            morreu = true;
            if (pontos) document.getElementById("form").style.display = "";
            else document.getElementById("form").remove();
        }

        for (let y = 0; y < tamanhoMapa; y++) {
            mapa.push([]);
            for (let x = 0; x < tamanhoMapa; x++) {
                mapa[y].push(" ");
            }
        }
        const exibicaoMapa = document.getElementById("exibicao-mapa");
        const exibicaoPontos = document.getElementById("exibicao-pontos");

        let timer;

        function adicionarPontos(num) {
            pontos += num;
            exibicaoPontos.innerText = "Pontos: " + pontos;
        }

        const obstaculos = [];
        function gerarObstaculo() {
            const obstaculo = [0,0];
            let posicaoValida = false;
            repetir: for (let i = 3; i; --i) {
                obstaculo[0] = aleatorio(tamanhoMapa);
                obstaculo[1] = aleatorio(tamanhoMapa);
                if (
                    Math.abs(obstaculo[0] - player[0]) <= 1 && 
                    Math.abs(obstaculo[1] - player[1]) <= 1
                ) continue repetir;
                if (
                    Math.abs(obstaculo[0] - ponto[0]) <= 1 && 
                    Math.abs(obstaculo[1] - ponto[1]) <= 1
                ) continue repetir;
                for (let i = 0; i < rastro.length; ++i) {
                    if (colisao(obstaculo, rastro)) {
                        continue repetir;
                    }
                }
                posicaoValida = true;
                break repetir;
            }
            if (posicaoValida) {
                mapa[obstaculo[1]][obstaculo[0]] = '!';
                obstaculos.push({ pos: obstaculo, tempo: aleatorio(3) + 1 });
            }
        }
        function limparObstaculos() {
            for (let i = 0; i < obstaculos.length; ++i) {
                const obstaculo = obstaculos[i];
                const tempo = --obstaculo.tempo;
                if (!tempo) {
                    mapa[obstaculo.pos[1]][obstaculo.pos[0]] = ' ';
                    obstaculos.splice(i, 1);
                    --i;
                }
            }
        }

        const filaDirecoes = [];
        let direcao = 3;
        let intervaloFrames = 500;
        let aumentarRastro = false;
        function atualizarMapa() {
            if (morreu) return;

            setTimeout(atualizarMapa, intervaloFrames);

            if (filaDirecoes.length) direcao = filaDirecoes.shift();

            if (aumentarRastro) {
                rastro.unshift([player[0], player[1]]);
                aumentarRastro = false;
            } else {
                const ultimoRastro = rastro.pop();
                mapa[ultimoRastro[1]][ultimoRastro[0]] = " ";
                ultimoRastro[0] = player[0];
                ultimoRastro[1] = player[1];
                rastro.unshift(ultimoRastro);
            }

            if (direcao === 0) player[0] += 1;
            else if (direcao === 1) player[1] += 1;
            else if (direcao === 2) player[0] -= 1;
            else if (direcao === 3) player[1] -= 1;

            if (
                player[0] < 0 || player[1] < 0 || 
                player[0] >= tamanhoMapa || player[1] >= tamanhoMapa
            ) {
                fimDeJogo();
            } else {
                for (let i = 0; i < rastro.length; ++i) {
                    if (colisao(player, rastro[i])) {
                        fimDeJogo();
                        break;
                    }
                }
            }
            if (!morreu) {
                for (let i = 0; i < obstaculos.length; ++i) {
                    if (colisao(player, obstaculos[i].pos)) {
                        fimDeJogo();
                        break;
                    }
                }
            }

            if (!morreu && colisao(player, ponto)) {
                aumentarRastro = true;
                adicionarPontos(1);
                if (intervaloFrames > 100) intervaloFrames = 500 - pontos * 10;

                repetir: while (true) {
                    ponto[0] = aleatorio(tamanhoMapa);
                    ponto[1] = aleatorio(tamanhoMapa);
                    if (colisao(player, ponto))
                        continue repetir;
                    for (let i = 0; i < rastro.length; ++i) {
                        if (colisao(ponto, rastro[i]))
                            continue repetir;
                    }
                    break repetir;
                }

                limparObstaculos();
                for (let i = aleatorio(2) +1; i; --i) {
                    gerarObstaculo();
                }
            }
            mapa[ponto[1]][ponto[0]] = "•";

            for (let i = 0; i < rastro.length; ++i)
                mapa[rastro[i][1]][rastro[i][0]] = "#";
            if (!morreu) mapa[player[1]][player[0]] = "@";

            exibicaoMapa.innerText = "";
            for (let y=0; y < tamanhoMapa; ++y) {
                exibicaoMapa.innerText += mapa[y].join(' ') + '\n';
            }

        }

        function mudarDirecao(num) {
            if (!filaDirecoes.length) {
                if (direcao !== num && (num+2)%4 !== direcao)
                    filaDirecoes.push(num);
                return;
            }
            if (filaDirecoes.length <= 2) {
                if (filaDirecoes[0] !== num && (num+2)%4 !== filaDirecoes[0])
                    filaDirecoes[1] = num;
                return;
            }
        }
        window.onkeydown = function (event) {
            if (event.key === 'r' || event.key === 'R') location.reload();

            switch (event.key) {
                case 'w': case 'W':
                case "ArrowUp":
                    mudarDirecao(3);
                    break;
                case 's': case 'S':
                case "ArrowDown":
                    mudarDirecao(1);
                    break;
                case 'a': case 'A':
                case "ArrowLeft":
                    mudarDirecao(2);
                    break;
                case 'd': case 'D':
                case "ArrowRight":
                    mudarDirecao(0);
                    break;
            }
        };

        atualizarMapa();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            query,
            orderBy,
            limit,
        } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcaPyH3dM_Coba2FG-qDceKeKNtSCk6pg",
            authDomain: "sitesito.firebaseapp.com",
            projectId: "sitesito",
            storageBucket: "sitesito.firebasestorage.app",
            messagingSenderId: "86542823836",
            appId: "1:86542823836:web:ebdd482005ce7fc020d859"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const nomeColecao = 'joguitos/tabelas/jogo03';

        const divPainelPontuacao = document.getElementById("painel-pontuacao");
        const botaoRegistrarPontuacao = document.getElementById("registrar-pontuacao");
        const inputNome = document.getElementById("input-nome");

        let queryTabela;
        async function atualizarPainel() {

            const documentoTemporario = document.createDocumentFragment();
            queryTabela = await getDocs(query(
                collection(db, nomeColecao), 
                orderBy('pontos', 'desc'), 
                limit(50)
            ));

            queryTabela.forEach((doc) => {
                const pontos = " " + doc.data().pontos;
                const nome = doc.id.padEnd(32 - pontos.length, ".") + pontos;

                const nodeNome = document.createTextNode(nome);
                documentoTemporario.appendChild(nodeNome);
                documentoTemporario.appendChild(document.createElement("br"));
            });
            divPainelPontuacao.innerHTML = 'Tabela de pontuação             <br>';
            divPainelPontuacao.appendChild(documentoTemporario);

        };
        atualizarPainel();

        async function registrarPontuacao() {

            if (location.hostname !== 'sitesito.web.app' && location.hostname !== 'davipolheim.github.io') {
                botaoRegistrarPontuacao.innerText = 'num vai da';
                return;
            }
            const nome = inputNome.value.replaceAll(' ','_').replace(/[^A-Za-z0-9_]/g,'');
            if (estaMorrido() && nome) {
                document.getElementById("form").remove();

                let pontuacaoAntiga;
                queryTabela.forEach((doc) => {
                    if (doc.id === nome) pontuacaoAntiga = doc.data().pontos;
                });
                if (lerPontos() && (!pontuacaoAntiga || pontuacaoAntiga < lerPontos())) {
                    await setDoc(doc(db, nomeColecao, nome), {
                        pontos: lerPontos(),
                    });
                }
                atualizarPainel();
            }

        };
        botaoRegistrarPontuacao.onclick = registrarPontuacao;
        inputNome.onkeydown = function(e) { if (e.key === 'Enter') registrarPontuacao(); };

    </script>
</body>
</html>
